[package]
name = "xmip-core-library-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-library-sql"
description = "SQL for Xmip: delimited text, a statement's verb, literals, one INSERT, a bound parameter, and the dialects ISO SQL, T-SQL, PostgreSQL, MariaDB, Oracle Database, IBM DB2 and SQLite."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The estate's encoding primitives: the character reader a delimited run is
# read with, the error it is refused with, and hex for a binary literal.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[lints]
workspace = true
